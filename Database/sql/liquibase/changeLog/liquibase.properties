# liquibase.properties

# JDBC driver information
driver: org.postgresql.Driver

# Connection details (update hostname, port, and database as appropriate)
url: jdbc:postgresql://postgres/competitiondata
username: postgres
password: postgres

# The default schema to use (matches the schema used in your SQL scripts)
defaultSchemaName: public

classpath: /liquibase/changelog

# Change Log file location relative to the properties file
changeLogFile: changelog.yaml

# Logging configuration
logLevel: info